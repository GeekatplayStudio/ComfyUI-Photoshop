<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:1000px;overflow:hidden}
.tile{width:1000px;height:1000px;position:relative;background:linear-gradient(135deg,#2b1366 0%,#16124a 55%,#0a0f2e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 26%,rgba(124,58,237,.55),rgba(124,58,237,0) 60%)}
svg{position:relative;width:520px;height:520px;margin-top:-40px}
.name{position:relative;color:#fff;font-weight:800;font-size:96px;letter-spacing:10px;margin-top:6px}
.sub{position:relative;color:#c4b5fd;font-weight:600;font-size:52px;letter-spacing:30px;margin-top:4px;padding-left:30px}
</style></head><body><div class="tile">
<svg viewBox="0 0 200 200"><defs>
<linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter></defs>
<path d="M150 58 A62 62 0 1 0 162 112 L112 112" fill="none" stroke="url(#a)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)" opacity=".8"/>
<path d="M150 58 A62 62 0 1 0 162 112 L112 112" fill="none" stroke="url(#a)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="138" y="34" width="34" height="34" rx="9" fill="url(#n)"/>
<circle cx="155" cy="51" r="6.5" fill="#fff"/>
</svg>
<div class="name">GEEKATPLAY</div><div class="sub">STUDIO</div>
</div></body></html>
